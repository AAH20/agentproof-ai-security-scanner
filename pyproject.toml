[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof-ai-security-scanner"
version = "0.1.0"
description = "Open-source AI agent security and MCP security scanner with prompt injection testing, OWASP Agentic Top 10 evidence passports, KPIs, and unit economics."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ahmed Hassan"}]
keywords = [
  "AI agent security", "MCP security scanner", "prompt injection testing",
  "AI red teaming", "AI governance", "OWASP Agentic Top 10",
  "agentic AI security", "LLM security testing"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security"
]

[project.scripts]
agentproof = "agentproof.cli:main"

[tool.setuptools.packages.find]
include = ["agentproof*"]
