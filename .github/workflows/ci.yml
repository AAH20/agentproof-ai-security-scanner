name: AI Agent Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m agentproof.cli scan examples/secure-agent/agentproof.json --output agentproof-passport.json
      - uses: actions/upload-artifact@v4
        with:
          name: agentproof-evidence-passport
          path: agentproof-passport.json
